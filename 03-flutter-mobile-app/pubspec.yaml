name: ai_motivation_app
description: AI-Powered Motivational Quote App built with Flutter and Antigravity assistance
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.2
  
  # State Management (if needed)
  provider: ^6.0.5
  
  # HTTP requests (for future API integration)
  http: ^1.1.0
  
  # Local storage
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  # Uncomment to add assets
  # assets:
  #   - images/
  #   - icons/

  # Uncomment to add custom fonts
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700
